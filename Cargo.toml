[package]
name = "redis-server-wrapper"
version = "0.5.0"
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
description = "Type-safe wrapper for redis-server and redis-cli with builder pattern APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/redis-server-wrapper"
documentation = "https://docs.rs/redis-server-wrapper"
homepage = "https://github.com/joshrotenberg/redis-server-wrapper"
keywords = ["redis", "testing", "wrapper", "server"]
categories = ["development-tools::testing", "database"]
readme = "README.md"
rust-version = "1.88"
exclude = [".github/", "tests/", "examples/"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
blocking = ["tokio"]
test-tls = ["dep:rcgen"]

# docs.rs builds with default features only unless told otherwise, which would
# publish the crate without the `blocking` and `test-tls` modules the README
# tells people to enable.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
glob = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "rt-multi-thread", "net", "io-util", "sync"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
which = "7"
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[[example]]
name = "redis-run"
path = "examples/redis-run.rs"

[workspace]
